<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小登快跑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#7ec8ff;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.panel{pointer-events:auto;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border-radius:26px;padding:18px 18px 16px;width:min(440px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(76,29,149,.25),inset 0 1px 0 rgba(255,255,255,.9);text-align:center;border:1.5px solid rgba(255,255,255,.8)}
h1{margin:0 0 2px;font-family:"ZCOOL KuaiLe",sans-serif;font-size:46px;letter-spacing:4px;font-weight:400;background:linear-gradient(180deg,#c084fc,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 4px 8px rgba(124,58,237,.35))}
.sub{color:#5b4b8a;font-size:13px;margin-bottom:12px}
.chars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 12px}
.ch{border:3px solid #cfe3f7;border-radius:14px;padding:4px 2px 2px;background:#f3f9ff;cursor:pointer;transition:transform .1s}
.ch img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.ch span{font-size:11px;color:#1e3a5f;font-weight:700}
.ch.sel{transform:translateY(-4px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid rgba(167,139,250,.35);background:rgba(255,255,255,.8);outline:none;text-align:center;color:#4c1d95;user-select:text;-webkit-user-select:text}
input:focus{border-color:#a78bfa}
.row{display:flex;gap:8px;margin-top:10px}
button{font:inherit;font-weight:800;font-size:17px;border:none;border-radius:16px;padding:12px 10px;flex:1;cursor:pointer;color:#fff;background:linear-gradient(180deg,#b388ff,#7c3aed);box-shadow:0 5px 0 #5b21b6,0 8px 18px rgba(124,58,237,.3);transition:transform .05s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #5b21b6}
button.blue{background:linear-gradient(180deg,#f9a8d4,#ec4899);box-shadow:0 5px 0 #be185d,0 8px 18px rgba(236,72,153,.25)}
button.gray{background:linear-gradient(180deg,#cbd5e1,#94a3b8);box-shadow:0 5px 0 #64748b}
button:disabled{opacity:.5}
.lbl{font-size:12px;color:#64748b;margin:10px 0 4px;text-align:left;font-weight:700}
.plist{list-style:none;padding:0;margin:8px 0;text-align:left}
.plist li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.7);margin-bottom:5px;color:#3b2a6b;font-weight:700}
.plist img{width:34px;height:34px;object-fit:contain}
.plist .me{background:#f3e8ff}
.plist .sc{margin-left:auto;font-variant-numeric:tabular-nums;color:#7c3aed}
.code{font-size:30px;font-weight:900;letter-spacing:6px;color:#7c3aed}
.note{font-size:12px;color:#64748b;margin-top:10px;line-height:1.5}
.hidden{display:none!important}
.tabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.tabs button{flex:0 0 auto;font-size:13px;padding:6px 10px;border-radius:999px;box-shadow:none;background:#e2e8f0;color:#1e3a5f}
.tabs button.on{color:#fff}
.plist .rk{width:24px;text-align:center;font-weight:900;color:#94a3b8}
.plist li:nth-child(1) .rk{color:#f59f00}.plist li:nth-child(2) .rk{color:#868e96}.plist li:nth-child(3) .rk{color:#c26b2b}
.newrec{display:inline-block;background:linear-gradient(90deg,#c084fc,#ec4899);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;margin-top:4px}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-family:"ZCOOL KuaiLe",sans-serif;color:#fff;text-shadow:0 2px 0 rgba(76,29,149,.8),0 0 8px rgba(76,29,149,.5);font-size:24px}
#pauseBtn{pointer-events:auto;font-size:14px;padding:6px 12px;flex:0}
#ctrl{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
#ctrl button{pointer-events:auto;flex:0 0 auto;width:78px;height:78px;border-radius:50%;font-size:22px;opacity:.85}
#count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:"ZCOOL KuaiLe",sans-serif;font-size:120px;color:#fff;text-shadow:0 6px 0 #7c3aed,0 0 40px rgba(124,58,237,.6);pointer-events:none}
.big{font-family:"ZCOOL KuaiLe",sans-serif;font-size:46px;color:#7c3aed;text-shadow:0 3px 0 #fff,0 6px 14px rgba(124,58,237,.3)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden"><div><span id="hScore">0</span> 分 · 🪙<span id="hCoin">0</span><div id="hPow" style="font-size:16px;margin-top:2px"></div></div><div id="hRank"></div></div>
<div id="ctrl" class="hidden"><button class="blue" id="bSlide">滑 ⬇</button><button id="bJump">跳 ⬆</button></div>
<div id="count" class="hidden"></div>

<div class="ui" id="uiMenu"><div class="panel">
  <h1>小登快跑</h1>
  <div class="sub">点一下跳 · 连点二段跳 · 下滑钻过小鸟<br>🧲 磁铁 · 🛡️ 护盾 · ×2 双倍 · 💎 宝石+50</div>
  <div class="lbl">选择你的小登</div>
  <div class="chars" id="chars"></div>
  <div class="lbl">昵称</div>
  <input id="nick" maxlength="8" placeholder="输入昵称">
  <div class="row"><button id="bSolo">单人跑</button><button class="gray" id="bBoard" style="flex:0 0 110px;background:#ffb703;box-shadow:0 5px 0 #c98a00">🏆 排行榜</button></div>
  <div class="row" id="netRow"><button class="blue" id="bCreate">创建房间</button><button class="blue" id="bJoinShow">加入房间</button></div>
  <div id="joinRow" class="row hidden"><input id="code" maxlength="4" placeholder="4位房间号" inputmode="numeric"><button class="blue" id="bJoin" style="flex:0 0 90px">加入</button></div>
  <div class="note" id="netNote">最高分：<b id="best">0</b></div>
</div></div>

<div class="ui hidden" id="uiLobby"><div class="panel">
  <div class="lbl" style="text-align:center">房间号（发给朋友）</div>
  <div class="code" id="lobCode"></div>
  <ul class="plist" id="lobList"></ul>
  <div class="row"><button id="bStart">开始比赛！</button></div>
  <div class="row"><button class="gray" id="bLeave">退出房间</button></div>
  <div class="note">任何人点"开始比赛"，房间里所有人一起倒计时开跑，赛道完全一样，跑得最远的赢。</div>
</div></div>

<div class="ui hidden" id="uiOver"><div class="panel">
  <div class="sub" style="font-size:18px;font-weight:800">摔倒啦！</div>
  <div class="big" id="ovScore">0</div>
  <div class="sub" id="ovBest"></div>
  <ul class="plist" id="ovList"></ul>
  <div class="row"><button id="bAgain">再来一局</button></div>
  <div class="row"><button class="gray" id="bMenu">返回</button></div>
</div></div>

<div class="ui hidden" id="uiBoard"><div class="panel">
  <div class="big" style="font-size:32px">🏆 排行榜</div>
  <div class="sub" id="bdSrc"></div>
  <div class="tabs" id="bdTabs"></div>
  <ul class="plist" id="bdList"></ul>
  <div class="row"><button class="gray" id="bBdBack">返回</button></div>
</div></div>
<div class="ui hidden" id="uiPause"><div class="panel">
  <div class="big">暂停</div>
  <div class="row"><button id="bResume">继续</button></div>
  <div class="row"><button class="gray" id="bQuit">退出</button></div>
</div></div>

const NAMES=['吉吉','禹禹','芝心','航酱','小苏'];
// main / dark / light per character: 1 orange, 2 green, 3 yellow, 4 blue, 5 red
const COL=[['#ff8c1a','#c45f00','#ffd2a3'],['#3cc96b','#1f8a45','#c3f2d2'],['#ffd23f','#c99a00','#fff2b8'],['#3b8cff','#1d5bc4','#cfe2ff'],['#ff4d5e','#c21f33','#ffd0d5']];
const imgs=HEADS.map(s=>{const i=new Image();i.src=s;return i});
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('xd_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('xd_'+k,JSON.stringify(v))}catch(e){}}};

let myChar=store.get('char',0), best=store.get('best',0);
$('nick').value=store.get('nick','')||'';
$('best').textContent=best;
function renderChars(){const c=$('chars');c.innerHTML='';HEADS.forEach((s,i)=>{const d=document.createElement('div');d.className='ch'+(i===myChar?' sel':'');d.style.background=COL[i][2];d.style.borderColor=i===myChar?COL[i][0]:'transparent';const im=document.createElement('img');im.src=s;const sp=document.createElement('span');sp.textContent=NAMES[i];d.append(im,sp);d.onclick=()=>{myChar=i;store.set('char',i);renderChars()};c.append(d)})}
renderChars();
function nick(){const v=$('nick').value.trim().slice(0,8);store.set('nick',v);return v||NAMES[myChar]}

/* ---------- canvas ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=800,H=450,S=1,DPR=1,OFF=0;
const VH=450, GROUND=370;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;S=Math.min(innerHeight/VH,innerWidth/560);W=innerWidth/S;H=innerHeight/S;OFF=H-VH;H=VH}
addEventListener('resize',resize);resize();

/* ---------- rng ---------- */
function rngFrom(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- game state ---------- */
const PX=210;
let G=null; // current run
let mode='menu'; // menu | count | run | over | lobby
let paused=false;
const ZONE_LEN=3000;
const ZONE_NAMES=['☀️ 晴空小镇','🌇 黄昏街道','🌙 星夜城市','🌸 樱花大道'];
function newRun(seed){
  return {seed,rng:rngFrom(seed),d:0,speed:340,y:0,vy:0,jumps:0,slide:0,alive:true,dead:0,coins:0,cash:0,pts:0,obs:[],coinsArr:[],pows:[],fx:[],next:600,t:0,phase:0,parts:[],shake:0,mag:0,x2:0,shield:0,inv:0,zone:0,nextMile:500,banner:{txt:ZONE_NAMES[0],t:2.2}}
}
function spawn(g){
  const r=g.rng; const x=g.next;
  const lvl=Math.min(1,g.d/9000);
  const k=r();
  if(k<0.28) g.obs.push({t:'box',x,w:46,h:46});
  else if(k<0.44) g.obs.push({t:'cone',x,w:34,h:40});
  else if(k<0.60+lvl*0.04) g.obs.push({t:'bird',x,w:54,h:30,y:GROUND-88-r()*14,f:r()*6});
  else if(k<0.72) {g.obs.push({t:'box',x,w:46,h:46});g.obs.push({t:'box',x,w:46,h:46,stack:1});}
  else if(k<0.86) g.obs.push({t:'log',x,w:88,h:34});
  else g.obs.push({t:'ball',x:x+120,w:40,h:40,vx:110+lvl*80});
  const gap=560-lvl*170+r()*(380-lvl*120);
  // coins & gems
  if(r()<0.62){const n=4+Math.floor(r()*4),arc=r()<0.5,hi=r()<0.3;for(let i=0;i<n;i++)g.coinsArr.push({x:x+180+i*38,y:arc?GROUND-60-Math.sin(i/(n-1)*Math.PI)*90:GROUND-40-(hi?80:0),got:0,gem:r()<0.07})}
  // power-ups
  if(r()<0.14){const tp=['mag','shield','x2'][Math.floor(r()*3)];g.pows.push({t:tp,x:x+gap*0.55,y:GROUND-70-r()*60,got:0})}
  g.next=x+gap;
}
function jump(){if(!G||mode!=='run'||!G.alive||paused)return;if(G.jumps<2){G.vy=G.jumps?-760:-880;G.jumps++;G.slide=0;sfx(G.jumps===1?520:700,.08);puff(PX,GROUND-G.y,6)}}
function slide(){if(!G||mode!=='run'||!G.alive||paused)return;if(G.y>0){G.vy=Math.max(G.vy,900)}G.slide=0.62;sfx(260,.06)}
function puff(x,y,n,col){for(let i=0;i<n;i++)G.parts.push({x,y,vx:-80-Math.random()*120,vy:-Math.random()*120,l:.4+Math.random()*.3,c:col||'rgba(255,255,255,.9)',r:3+Math.random()*4})}

function hitbox(g){const sl=g.slide>0&&g.y<=0;const h=sl?46:106;return{x1:PX-20,x2:PX+22,y2:GROUND-g.y,y1:GROUND-g.y-h}}
function obsBox(o,d){const sx=o.x-d+PX;if(o.t==='ball')return{x1:sx+5,x2:sx+35,y1:GROUND-36,y2:GROUND};if(o.t==='bird')return{x1:sx+6,x2:sx+o.w-6,y1:o.y,y2:o.y+o.h};const base=o.stack?GROUND-46:GROUND;return{x1:sx+5,x2:sx+o.w-5,y1:base-o.h+4,y2:base}}
const hit=(a,b)=>a.x1<b.x2&&a.x2>b.x1&&a.y1<b.y2&&a.y2>b.y1;

function addFx(txt,x,y,col,size){G.fx.push({txt,x,y,col:col||'#fff',t:1.1,size:size||20})}
function step(dt){
  const g=G;g.t+=dt;
  if(g.alive){
    g.speed=Math.min(820,340+g.d*0.028);
    g.d+=g.speed*dt;g.phase+=dt*g.speed/28;
    g.pts+=g.speed*dt/10*(g.x2>0?2:1);
    g.vy+=2600*dt;g.y-=g.vy*dt;
    if(g.y<=0){if(g.vy>0&&g.jumps)puff(PX,GROUND,4);g.y=0;g.vy=0;g.jumps=0}
    if(g.slide>0)g.slide-=dt;
    if(g.mag>0)g.mag-=dt;if(g.x2>0)g.x2-=dt;if(g.inv>0)g.inv-=dt;
    while(g.next<g.d+W+300)spawn(g);
    for(const o of g.obs)if(o.t==='ball')o.x-=o.vx*dt;
    const hb=hitbox(g);
    for(const o of g.obs){if(o.gone)continue;if(hit(hb,obsBox(o,g.d))){
      if(g.inv>0)continue;
      if(g.shield){g.shield=0;g.inv=1.2;o.gone=1;g.shake=.15;sfx(330,.15,'triangle');puff(o.x-g.d+PX+20,GROUND-30,16,'#c4b5fd');addFx('护盾挡住啦！',PX,GROUND-170,'#a78bfa');continue}
      die();break}}
    const py=GROUND-g.y-55;
    for(const c of g.coinsArr){if(c.got)continue;
      if(g.mag>0&&c.x-g.d<260&&c.x-g.d>-40){c.x+=(g.d-c.x)*Math.min(1,dt*9);c.y+=(py-c.y)*Math.min(1,dt*9)}
      const sx=c.x-g.d+PX;if(Math.abs(sx-PX)<30&&c.y>hb.y1-14&&c.y<hb.y2+14){c.got=1;g.coins++;const v=(c.gem?50:10)*(g.x2>0?2:1);g.cash+=v;sfx(c.gem?1320:980,.05);puff(sx,c.y,c.gem?9:5,c.gem?'#c084fc':'#ffd43b');if(c.gem)addFx('+'+v,sx,c.y-20,'#c084fc',18)}}
    for(const p of g.pows){if(p.got)continue;const sx=p.x-g.d+PX;if(Math.abs(sx-PX)<36&&p.y>hb.y1-20&&p.y<hb.y2+20){p.got=1;sfx(660,.2,'triangle');puff(sx,p.y,14,'#fde68a');
      if(p.t==='mag'){g.mag=8;addFx('🧲 磁铁！',PX,GROUND-170,'#f87171')}else if(p.t==='x2'){g.x2=8;addFx('✨ 双倍得分！',PX,GROUND-170,'#fbbf24')}else{g.shield=1;addFx('🛡️ 护盾！',PX,GROUND-170,'#a78bfa')}}}

function pres(p){const q=p.presence||{};return{n:String(q.n||'玩家').slice(0,8),c:Math.max(0,Math.min(4,q.c|0)),st:String(q.st||''),rd:q.rd&&typeof q.rd==='object'?q.rd:null,d:+q.d||0,y:+q.y||0,sl:!!q.sl,sc:q.sc|0,rid:q.rid==null?null:String(q.rid)}}
function onPeers(){
  // watch for a round start announced by anyone
  for(const p of peersList()){const q=pres(p);if(q.rd&&q.rd.id&&q.rd.id!==lastRound&&typeof q.rd.seed==='number'){ if(mode==='lobby'||mode==='over'){lastRound=q.rd.id;startRound(q.rd.seed,String(q.rd.id));} else lastRound=q.rd.id; }}
  if(mode==='lobby')renderLobby();
  if(mode==='over')renderOver();
}
function renderLobby(){const ul=$('lobList');ul.innerHTML='';for(const p of peersList()){const q=pres(p);ul.append(pRow(q,p.sameTab,q.st==='lobby'?'准备中':q.st==='run'?'跑步中…':q.st==='dead'?q.sc+'分':''))}}
function pRow(q,me,right){const li=document.createElement('li');if(me)li.className='me';const im=document.createElement('img');im.src=HEADS[q.c];im.style.background=COL[q.c][2];im.style.borderRadius='50%';const s=document.createElement('span');s.textContent=q.n+(me?'（你）':'');const r=document.createElement('span');r.className='sc';r.textContent=right;li.append(im,s,r);return li}
function netPresence(force){if(!net||!G)return;const now=performance.now();if(!force&&now-lastPres<90)return;lastPres=now;
  net.presence({n:nick(),c:myChar,st:G.alive?'run':'dead',d:Math.round(G.d),y:Math.round(G.y),sl:G.slide>0?1:0,sc:score(G),rid:roundId}).catch(()=>{})}

/* ---------- flow ---------- */
function show(m){mode=m;['Menu','Lobby','Over','Pause','Board'].forEach(k=>$('ui'+k).classList.toggle('hidden',k.toLowerCase()!==m));
  const playing=m==='run'||m==='count';$('hud').classList.toggle('hidden',!playing);$('ctrl').classList.toggle('hidden',!playing);if(m==='lobby')renderLobby();if(m!=='pause')paused=false}
function startRound(seed,rid){
  roundId=rid||null;G=newRun(seed);ghosts={};show('count');
  let n=3;$('count').classList.remove('hidden');$('count').textContent=n;sfx(440,.1);
  const iv=setInterval(()=>{n--;if(n>0){$('count').textContent=n;sfx(440,.1)}else{clearInterval(iv);$('count').textContent='跑！';sfx(880,.15);setTimeout(()=>$('count').classList.add('hidden'),500);mode='run';netPresence(true)}},800);
  if(net)net.presence({st:'run',rid:roundId,d:0,sc:0}).catch(()=>{});
}
function showOver(){show('over');$('ovScore').textContent=score(G)+' 分';$('ovBest').innerHTML='';$('ovBest').append(document.createTextNode(NAMES[myChar]+'的最好成绩 '+cbest[myChar]+' · 金币 '+G.coins));if(G._rec){const b=document.createElement('div');b.className='newrec';b.textContent='新纪录！';$('ovBest').append(document.createElement('br'),b)}$('best').textContent=best;renderOver()}
function renderOver(){const ul=$('ovList');ul.innerHTML='';if(!net){$('bAgain').textContent='再来一局';return}
  $('bAgain').textContent='再来一局（全房间）';
  const arr=peersList().map(p=>({p,q:pres(p)})).filter(o=>o.q.rid===roundId).sort((a,b)=>b.q.sc-a.q.sc);
  arr.forEach((o,i)=>ul.append(pRow(o.q,o.p.sameTab,(i===0?'🏆 ':'')+o.q.sc+(o.q.st==='run'?' 跑步中…':''))))}
function announceRound(){const seed=(Math.random()*1e9)|0,id=Date.now()+'-'+Math.floor(Math.random()*1e4);lastRound=id;net.presence({rd:{seed,id}}).catch(()=>{});startRound(seed,id)}

$('bSolo').onclick=()=>{nick();unlockAudio();net=null;startRound((Math.random()*1e9)|0,null)};
$('bCreate').onclick=()=>{unlockAudio();joinRoom(String(1000+Math.floor(Math.random()*9000)))};
$('bJoinShow').onclick=()=>{$('joinRow').classList.toggle('hidden');$('code').focus()};
$('bJoin').onclick=()=>{const c=$('code').value.replace(/\D/g,'');if(c.length!==4){toast('请输入4位房间号');return}unlockAudio();joinRoom(c)};
$('bStart').onclick=()=>{unlockAudio();announceRound()};
$('bLeave').onclick=async()=>{if(net){try{await net.leave()}catch(e){}}net=null;show('menu')};
$('bAgain').onclick=()=>{if(net)announceRound();else startRound((Math.random()*1e9)|0,null)};
$('bMenu').onclick=()=>{if(net){net.presence({st:'lobby'}).catch(()=>{});show('lobby')}else show('menu')};
$('bResume').onclick=()=>{paused=false;show('run')};
$('bQuit').onclick=()=>{paused=false;G.alive=false;showOver()};


/* ---------- leaderboard ---------- */
let runs=store.get('runs',[]), cbest=store.get('cbest',[0,0,0,0,0]);
let gdb=null,uid=null,gRows=null,myDoc=null,bdTab=-1;
Promise.all([window.claude&&claude.use?claude.use('db').catch(()=>null):null, window.claude&&claude.use?claude.use('user').catch(()=>null):null]).then(async([d,u])=>{
  if(!d||!u)return; try{uid=await u.id()}catch(e){} if(!uid)return; gdb=d;
  try{gdb.collection('scores').orderBy('top','desc').limit(100).onSnapshot(sn=>{gRows=sn.docs.map(x=>({id:x.id,...x.data()}));const me=gRows.find(r=>r.id===uid);if(me)myDoc=me;if(mode==='board')renderBoard()},()=>{gdb=null})}catch(e){gdb=null}
});
async function recordScore(sc){
  const n=nick(),c=myChar;let rec=false;
  if(sc>cbest[c]){cbest[c]=sc;store.set('cbest',cbest);rec=true}
  runs.push({n,c,sc,t:Date.now()});runs.sort((a,b)=>b.sc-a.sc);runs=runs.slice(0,30);store.set('runs',runs);
  if(gdb&&uid){const b=(myDoc&&Array.isArray(myDoc.b)?myDoc.b.slice(0,5):[0,0,0,0,0]).map(v=>+v||0);
    if(sc>b[c]||!myDoc||myDoc.n!==n){b[c]=Math.max(b[c],sc);const top=Math.max(...b);const body={n,b,top,c:b.indexOf(top),t:Date.now()};myDoc={id:uid,...body};
      try{await gdb.collection('scores').doc(uid).set(body)}catch(e){gdb=null}}}
  return rec;
}
function renderBoard(){
  const tabs=$('bdTabs');tabs.innerHTML='';
  [[-1,'全部','#1e3a5f'],...NAMES.map((n,i)=>[i,n,COL[i][0]])].forEach(([i,n,col])=>{const b=document.createElement('button');b.textContent=n;if(i===bdTab){b.className='on';b.style.background=col}b.onclick=()=>{bdTab=i;renderBoard()};tabs.append(b)});
  let rows;const global=gdb&&gRows&&gRows.length;
  if(global){rows=gRows.map(r=>{const b=Array.isArray(r.b)?r.b.map(v=>+v||0):[0,0,0,0,0];return bdTab<0?{n:String(r.n||'玩家').slice(0,8),c:Math.max(0,Math.min(4,r.c|0)),sc:+r.top||0,me:r.id===uid}:{n:String(r.n||'玩家').slice(0,8),c:bdTab,sc:b[bdTab]||0,me:r.id===uid}}).filter(r=>r.sc>0)}
  else rows=runs.filter(r=>bdTab<0||r.c===bdTab).map(r=>({...r,me:false}));
  rows.sort((a,b)=>b.sc-a.sc);rows=rows.slice(0,20);
  $('bdSrc').textContent=global?'所有玩家的最好成绩':'这台设备上的最好成绩';
  const ul=$('bdList');ul.innerHTML='';
  if(!rows.length){const li=document.createElement('li');li.textContent='还没有成绩，快去跑一局！';ul.append(li);return}
  rows.forEach((r,i)=>{const li=pRow(r,r.me,r.sc+' 分');const rk=document.createElement('span');rk.className='rk';rk.textContent=i+1;li.prepend(rk);ul.append(li)});
}
$('bBoard').onclick=()=>{show('board');renderBoard()};
$('bBdBack').onclick=()=>show('menu');

/* ---------- input ---------- */
$('bJump').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();jump()});
$('bSlide').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();slide()});
let ty=null;
cv.addEventListener('pointerdown',e=>{ty=e.clientY;});
cv.addEventListener('pointerup',e=>{if(ty==null)return;const dy=e.clientY-ty;ty=null;if(dy>40)slide();else jump()});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}else if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();slide()}else if(e.code==='Escape'||e.code==='KeyP'){if(mode==='run'&&!net){paused=!paused;show(paused?'pause':'run');mode=paused?'pause':'run';if(paused)$('uiPause').classList.remove('hidden')}}});
function toast(t){const n=$('netNote');const old=n.innerHTML;n.textContent=t;setTimeout(()=>n.innerHTML=old,1800)}

/* ---------- audio ---------- */
let AC=null;function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function sfx(f,dur,type){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;o.frequency.exponentialRampToValueAtTime(f*1.5,AC.currentTime+dur);g.gain.value=.06;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur)}catch(e){}}

/* ---------- loop ---------- */
let last=performance.now(),demoD=0;
function loop(now){
  try{frame(now)}catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
function frame(now){
  const dt=Math.max(0,Math.min(.033,(now-last)/1000));last=now;bgT+=dt;
  ctx.setTransform(S*DPR,0,0,S*DPR,0,OFF*S*DPR);
  if(G&&(mode==='run'||mode==='count'||mode==='over'||mode==='pause')){
    if(mode==='run'&&!paused)step(dt);
    if(mode==='over'&&G)step(dt);
    if(mode==='run')netPresence(false);
    ctx.save();if(G.shake>0)ctx.translate((Math.random()-.5)*10,(Math.random()-.5)*10);
    drawBG(G.d);
    for(const c of G.coinsArr)drawCoin(c,G.d);
    for(const o of G.obs)drawObs(o,G.d);
    for(const p of G.pows)drawPow(p,G.d);
    // ghosts
    let rank=1,total=1;
    if(net){for(const p of peersList()){if(p.sameTab)continue;const q=pres(p);if(q.rid!==roundId||!roundId)continue;total++;
      const gh=ghosts[p.peer]||(ghosts[p.peer]={d:q.d,y:q.y,ph:0});gh.d+=(q.d-gh.d)*Math.min(1,dt*10);gh.y+=(q.y-gh.y)*Math.min(1,dt*12);if(q.st==='run')gh.ph+=dt*16;
      if(q.d>G.d)rank++;
      const gx=PX+(gh.d-G.d);if(gx<-60||gx>W+60){drawEdge(gx,q);continue}
      drawRunner(gx,GROUND-Math.max(0,gh.y),q.c,gh.ph,q.st==='dead'?'dead':q.sl?'slide':gh.y>2?'air':'run',.55,q.n)}}
    const st=!G.alive?'dead':G.slide>0&&G.y<=0?'slide':G.y>0?'air':'run';
    drawRunner(PX,GROUND-G.y,myChar,G.alive?G.phase:G.dead*4,st,G.inv>0&&Math.sin(bgT*40)>0?.45:1,net?'你':'');
    if(G.shield&&G.alive){const r=62+Math.sin(bgT*5)*3,cy=GROUND-G.y-52;const g=ctx.createRadialGradient(PX,cy,r*.6,PX,cy,r);g.addColorStop(0,'rgba(196,181,253,0)');g.addColorStop(1,'rgba(167,139,250,.35)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(PX,cy,r,0,7);ctx.fill();ctx.strokeStyle='rgba(167,139,250,.8)';ctx.lineWidth=2;ctx.stroke()}
    if(G.mag>0&&G.alive){ctx.strokeStyle=`rgba(248,113,113,${.25+.15*Math.sin(bgT*8)})`;ctx.lineWidth=2;ctx.setLineDash([6,8]);ctx.beginPath();ctx.arc(PX,GROUND-G.y-52,90,0,7);ctx.stroke();ctx.setLineDash([])}
    for(const p of G.parts){ctx.globalAlpha=Math.max(0,p.l*2);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(const f of G.fx){ctx.globalAlpha=Math.min(1,f.t*2);ctx.font=`900 ${f.size}px "ZCOOL KuaiLe",sans-serif`;ctx.lineWidth=5;ctx.strokeStyle='rgba(60,30,110,.75)';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y)}ctx.globalAlpha=1;
    if(G.banner&&G.banner.t>0){const a=Math.min(1,G.banner.t*1.5,(2.6-G.banner.t)*3);ctx.globalAlpha=Math.max(0,a);ctx.font='900 30px "ZCOOL KuaiLe",sans-serif';const tw=ctx.measureText(G.banner.txt).width+48;ctx.fillStyle='rgba(76,29,149,.55)';rr(W/2-tw/2,72,tw,50,25);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(G.banner.txt,W/2,98);ctx.globalAlpha=1}
    ctx.restore();
    $('hScore').textContent=score(G);$('hCoin').textContent=G.coins;$('hPow').textContent=(G.shield?'🛡️ ':'')+(G.mag>0?'🧲'+Math.ceil(G.mag)+' ':'')+(G.x2>0?'×2 '+Math.ceil(G.x2):'');$('hRank').textContent=net&&total>1?`第 ${rank}/${total} 名`:'';
  }else{
    // attract mode on menu/lobby
    demoD+=dt*300;drawBG(demoD);
    const ph=bgT*12;for(let i=0;i<5;i++){drawRunner(W/2-170+i*85,GROUND-Math.max(0,Math.sin(bgT*3+i)*40),i,ph+i,Math.sin(bgT*3+i)>0?'air':'run',1,'')}
  }
}
function drawEdge(gx,q){const right=gx>W;const x=right?W-26:26;ctx.save();ctx.globalAlpha=.85;ctx.fillStyle='rgba(30,58,95,.7)';ctx.beginPath();ctx.arc(x,GROUND-150,20,0,7);ctx.fill();const im=imgs[q.c];if(im.complete)ctx.drawImage(im,x-16,GROUND-168,32,34);ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText((right?'▶ ':'◀ ')+q.n,x+(right?-30:30),GROUND-120);ctx.restore()}
requestAnimationFrame(loop);
</script>
</body>
